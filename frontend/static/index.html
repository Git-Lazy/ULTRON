<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultron</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid"></div>
    <main>
        <div class="orb" aria-hidden="true">
            <div class="orb-core"></div>
            <div class="orb-ring"></div>
            <div class="orb-ring orb-ring--alt"></div>
        </div>
        <h1>Ultron</h1>
        <p class="tagline">Ultra Light Trained Robot of Neumont</p>
        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">System online</span>
        </div>

        <form class="search" onsubmit="event.preventDefault(); handleSearch();">
            <input type="text" id="search-input" class="search-input" placeholder="Query Ultron..." autocomplete="off">
            <button type="submit" class="search-button">Send</button>
        </form>

        <section class="panels">
            <div class="panel">
                <h2 class="panel-title">Upload</h2>

                <div class="upload-section">
                    <h3 class="subsection-title">Image</h3>

                    <div class="class-selector">
                        <span class="field-label">Class</span>
                        <div class="class-list" id="class-list" aria-label="Image classes">
                            <span class="class-empty" id="class-empty">No classes loaded</span>
                            <button type="button" class="class-chip class-chip--custom" id="add-custom-class" onclick="toggleCustomClassForm()">+ Custom</button>
                        </div>
                    </div>

                    <div class="custom-class-form" id="custom-class-form" hidden>
                        <input type="text" class="text-input" id="custom-class-name" placeholder="Class name" autocomplete="off">
                        <label class="upload-zone upload-zone--small" for="custom-class-examples">
                            <input type="file" id="custom-class-examples" accept="image/*" multiple hidden onchange="handleCustomClassExamples(event)">
                            <span class="upload-hint">Add example images</span>
                        </label>
                        <div class="image-grid image-grid--small" id="custom-class-images"></div>
                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="saveCustomClass()">Save</button>
                            <button type="button" class="btn-secondary btn-secondary--ghost" onclick="cancelCustomClass()">Cancel</button>
                        </div>
                    </div>

                    <label class="upload-zone" for="upload-input">
                        <input type="file" id="upload-input" accept="image/*" hidden onchange="handleImageUpload(event)">
                        <span class="upload-hint">Drop image or click to select</span>
                    </label>
                    <div class="image-grid" id="uploaded-images" aria-label="Uploaded images"></div>
                </div>

                <div class="upload-section">
                    <h3 class="subsection-title">Folder</h3>
                    <label class="upload-zone" for="folder-input">
                        <input type="file" id="folder-input" webkitdirectory directory multiple hidden onchange="handleFolderUpload(event)">
                        <span class="upload-hint">Select folder</span>
                    </label>
                    <div class="folder-summary" id="folder-summary"></div>
                    <div class="image-grid" id="uploaded-folder-images" aria-label="Folder images"></div>
                </div>
            </div>

            <div class="panel">
                <h2 class="panel-title">Output</h2>
                <div class="image-grid" id="output-images" aria-label="Output images">
                    <div class="image-placeholder">Awaiting response...</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = 'http://localhost:8000';

        const state = {
            premadeClasses: [],
            customClasses: [],
            selectedClass: null,
            pendingCustomExamples: [],
        };

        function setStatus(text, ok = true) {
            const dot = document.querySelector('.status-dot');
            document.querySelector('.status-text').textContent = text;
            dot.style.background = ok ? '#4ade80' : '#c8102e';
            dot.style.boxShadow = `0 0 8px ${ok ? '#4ade80' : '#c8102e'}`;
        }

        function renderOutput(images) {
            const target = document.getElementById('output-images');
            target.innerHTML = '';
            if (!images || images.length === 0) {
                const ph = document.createElement('div');
                ph.className = 'image-placeholder';
                ph.textContent = 'No results';
                target.appendChild(ph);
                return;
            }
            for (const src of images) {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'thumb';
                target.appendChild(img);
            }
        }

        function renderClassList() {
            const list = document.getElementById('class-list');
            const empty = document.getElementById('class-empty');
            const addBtn = document.getElementById('add-custom-class');

            list.querySelectorAll('.class-chip:not(.class-chip--custom)').forEach(el => el.remove());

            const all = [
                ...state.premadeClasses.map(c => ({ name: c, custom: false })),
                ...state.customClasses.map(c => ({ name: c.name, custom: true })),
            ];

            empty.style.display = all.length === 0 ? '' : 'none';

            for (const cls of all) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'class-chip';
                if (cls.custom) chip.classList.add('class-chip--user');
                if (state.selectedClass === cls.name) chip.classList.add('class-chip--selected');
                chip.textContent = cls.name;
                chip.onclick = () => {
                    state.selectedClass = state.selectedClass === cls.name ? null : cls.name;
                    renderClassList();
                };
                list.insertBefore(chip, addBtn);
            }
        }

        async function loadPremadeClasses() {
            // Placeholder — backend will populate /api/classes later.
            try {
                const res = await fetch(`${API_BASE}/api/classes`);
                if (!res.ok) return;
                const data = await res.json();
                if (Array.isArray(data.classes)) {
                    state.premadeClasses = data.classes;
                    renderClassList();
                }
            } catch (_) {
                // Backend not reachable yet; leave the slot empty.
            }
        }

        function toggleCustomClassForm() {
            const form = document.getElementById('custom-class-form');
            form.hidden = !form.hidden;
            if (form.hidden) cancelCustomClass();
        }

        function handleCustomClassExamples(event) {
            const grid = document.getElementById('custom-class-images');
            const files = Array.from(event.target.files);
            for (const file of files) {
                state.pendingCustomExamples.push(file);
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'thumb';
                img.alt = file.name;
                grid.appendChild(img);
            }
            event.target.value = '';
        }

        function cancelCustomClass() {
            document.getElementById('custom-class-name').value = '';
            document.getElementById('custom-class-images').innerHTML = '';
            state.pendingCustomExamples = [];
            document.getElementById('custom-class-form').hidden = true;
        }

        async function saveCustomClass() {
            const nameInput = document.getElementById('custom-class-name');
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }
            const examples = state.pendingCustomExamples.slice();

            state.customClasses.push({ name, examples });
            state.selectedClass = name;

            setStatus('Saving class...');
            try {
                const form = new FormData();
                form.append('name', name);
                for (const file of examples) form.append('examples', file, file.name);
                const res = await fetch(`${API_BASE}/api/classes`, {
                    method: 'POST',
                    body: form
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                setStatus('System online');
            } catch (err) {
                console.error(err);
                setStatus('Backend offline', false);
            }

            cancelCustomClass();
            renderClassList();
        }

        async function handleImageUpload(event) {
            const target = document.getElementById('uploaded-images');
            const file = event.target.files[0];
            if (!file) return;

            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.className = 'thumb';
            img.alt = file.name;
            target.appendChild(img);

            setStatus('Uploading...');
            try {
                const form = new FormData();
                form.append('image', file, file.name);
                if (state.selectedClass) form.append('class', state.selectedClass);
                const res = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: form
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                setStatus('System online');
            } catch (err) {
                console.error(err);
                setStatus('Backend offline', false);
            }
            event.target.value = '';
        }

        async function handleFolderUpload(event) {
            const grid = document.getElementById('uploaded-folder-images');
            const summary = document.getElementById('folder-summary');
            grid.innerHTML = '';

            const files = Array.from(event.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) {
                summary.textContent = 'No images found';
                return;
            }

            const folderName = files[0].webkitRelativePath.split('/')[0] || 'folder';
            summary.textContent = `${folderName} · ${files.length} images`;

            for (const file of files.slice(0, 24)) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'thumb';
                img.alt = file.name;
                grid.appendChild(img);
            }

            setStatus('Uploading folder...');
            try {
                const form = new FormData();
                form.append('folder', folderName);
                for (const file of files) {
                    form.append('images', file, file.webkitRelativePath || file.name);
                }
                const res = await fetch(`${API_BASE}/api/upload-folder`, {
                    method: 'POST',
                    body: form
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                setStatus('System online');
            } catch (err) {
                console.error(err);
                setStatus('Backend offline', false);
            }
            event.target.value = '';
        }

        async function handleSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            setStatus('Querying...');
            try {
                const res = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderOutput(data.images);
                setStatus('System online');
            } catch (err) {
                console.error(err);
                setStatus('Backend offline', false);
            }
        }

        renderClassList();
        loadPremadeClasses();
    </script>
</body>
</html>
